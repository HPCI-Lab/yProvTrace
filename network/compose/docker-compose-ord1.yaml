volumes:
  orderer_ord1_data: 
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data_hlf1/fabric/orderer_ord1_data

networks:
  fabric_net:
    name: fabric_net

services:
  orderer.ord1.testbed.local:
    user: 1000:988
    container_name: orderer.ord1.testbed.local
    image: hyperledger/fabric-orderer:${FABRIC_VERSION}
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LOCALMSPID=Ord1MSP
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=5001
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:5002
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:5003
    working_dir: /root
    command: orderer
    volumes:
      - ../config/orderer.yaml:/etc/hyperledger/fabric/orderer.yaml:ro
      - ../organizations/ordererOrganizations/ord1.testbed.local/orderers/orderer.ord1.testbed.local:/etc/hyperledger/fabric:ro
      - orderer_ord1_data:/var/hyperledger
    ports:
      - 5001:5001
      - 5002:5002
      - 5003:5003
    networks:
      - fabric_net