volumes:
  peer0_org1_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data_hlf1/fabric/peer0_org1_data


networks:
  fabric_net:
    name: fabric_net

services:
  peer0.org1.testbed.local:
    user: 1000:988
    container_name: peer0.org1.testbed.local
    image: hyperledger/fabric-peer:${FABRIC_VERSION}
    labels:
      service: hyperledger-fabric
    environment:
      # General variables
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_net
      # Peer specific variables
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_ID=peer0.org1.testbed.local
      - CORE_PEER_ADDRESS=peer0.org1.testbed.local:6001
      - CORE_PEER_LISTENADDRESS=0.0.0.0:6001
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.testbed.local:6002
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:6002
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.testbed.local:6001
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.testbed.local:6001
      - CORE_OPERATIONS_LISTENADDRESS=peer0.org1.testbed.local:6003
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../config/core.yaml:/etc/hyperledger/fabric/core.yaml:ro
      - ../organizations/peerOrganizations/org1.testbed.local/peers/peer0.org1.testbed.local:/etc/hyperledger/fabric:ro
      - peer0_org1_data:/var/hyperledger/production
    ports:
      - 6001:6001
      - 6003:6003
    networks:
      - fabric_net