volumes:
  peer0_org4_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data_hlf1/fabric/peer0_org4_data

  peer1_org4_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data_hlf1/fabric/peer1_org4_data

networks:
  fabric_net:
    name: fabric_net

services:
  peer0.org4.testbed.local:
    user: 1000:988
    container_name: peer0.org4.testbed.local
    image: hyperledger/fabric-peer:${FABRIC_VERSION}
    labels:
      service: hyperledger-fabric
    environment:
      # General variables
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_net
      # Peer specific variables
      - CORE_PEER_LOCALMSPID=Org4MSP
      - CORE_PEER_ID=peer0.org4.testbed.local
      - CORE_PEER_ADDRESS=peer0.org4.testbed.local:6010
      - CORE_PEER_LISTENADDRESS=0.0.0.0:6010
      - CORE_PEER_CHAINCODEADDRESS=peer0.org4.testbed.local:6011
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:6011
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org4.testbed.local:6010
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org4.testbed.local:6010
      - CORE_OPERATIONS_LISTENADDRESS=peer0.org4.testbed.local:6012
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../config/core.yaml:/etc/hyperledger/fabric/core.yaml:ro
      - ../organizations/peerOrganizations/org4.testbed.local/peers/peer0.org4.testbed.local:/etc/hyperledger/fabric:ro
      - peer0_org4_data:/var/hyperledger
    ports:
      - 6010:6010
      - 6012:6012
    networks:
      - fabric_net
  
  peer1.org4.testbed.local:
    container_name: peer1.org4.testbed.local
    image: hyperledger/fabric-peer:${FABRIC_VERSION}
    labels:
      service: hyperledger-fabric
    environment:
      # General variables
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_net
      # Peer specific variables
      - CORE_PEER_LOCALMSPID=Org4MSP
      - CORE_PEER_ID=peer1.org4.testbed.local
      - CORE_PEER_ADDRESS=peer1.org4.testbed.local:6013
      - CORE_PEER_LISTENADDRESS=0.0.0.0:6013
      - CORE_PEER_CHAINCODEADDRESS=peer1.org4.testbed.local:6014
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:6014
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.org4.testbed.local:6013
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.org4.testbed.local:6013
      - CORE_OPERATIONS_LISTENADDRESS=peer1.org4.testbed.local:6015
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../config/core.yaml:/etc/hyperledger/fabric/core.yaml:ro
      - ../organizations/peerOrganizations/org4.testbed.local/peers/peer1.org4.testbed.local:/etc/hyperledger/fabric:ro
      - peer1_org4_data:/var/hyperledger
    ports:
      - 6013:6013
      - 6015:6015
    networks:
      - fabric_net