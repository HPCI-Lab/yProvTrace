Organizations:
  - &HPCIlabOrd1
    Name: HPCIlabOrd1
    ID: HPCIlabOrd1MSP
    MSPDir: ../identities/ordererOrganizations/hpcilab_ord1.testbed.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('HPCIlabOrd1MSP.member')" #member matches any user of the organization
      Writers:
        Type: Signature
        Rule: "OR('HPCIlabOrd1MSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('HPCIlabOrd1MSP.admin')"
    OrdererEndpoints:
      - hlf1.disi.unitn.it:5001
  
  - &HPCIlabOrd2
    Name: HPCIlabOrd2
    ID: HPCIlabOrd2MSP
    MSPDir: ../identities/ordererOrganizations/hpcilab_ord2.testbed.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('HPCIlabOrd2MSP.member')" #member matches any user of the organization
      Writers:
        Type: Signature
        Rule: "OR('HPCIlabOrd2MSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('HPCIlabOrd2MSP.admin')"
    OrdererEndpoints:
      - hlf1.disi.unitn.it:5004

  - &HPCIlabOrd3
    Name: HPCIlabOrd3
    ID: HPCIlabOrd3MSP
    MSPDir: ../identities/ordererOrganizations/hpcilab_ord3.testbed.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('HPCIlabOrd3MSP.member')" #member matches any user of the organization
      Writers:
        Type: Signature
        Rule: "OR('HPCIlabOrd3MSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('HPCIlabOrd3MSP.admin')"
    OrdererEndpoints:
      - hlf1.disi.unitn.it:5007
  
  - &HPCIlab
    Name: HPCIlab
    ID: HPCIlabMSP
    MSPDir: ../identities/peerOrganizations/hpcilab.testbed.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('HPCIlabMSP.admin', 'HPCIlabMSP.peer', 'HPCIlabMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('HPCIlabMSP.admin', 'HPCIlabMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('HPCIlabMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('HPCIlabMSP.peer')"
    AnchorPeers:
      - Host: hlf1.disi.unitn.it #must be properly assigned through DNS (In docker compose through container name)
        Port: 6001

Capabilities: #all defined at v2 since we don't need retrocompatibility and want to empoy newest features
  Channel: &ChannelCapabilities
    V2_0: true

  Orderer: &OrdererCapabilities
    V2_0: true

  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations: #This is left balnk sunnce I'm defining a template, once it is used (later in the file), organizations will be defined (and merged with this empty set)

  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement: #Policy that defines the condition necessary for a chaincode to be installed/updated
      Type: ImplicitMeta
      Rule: "ALL Endorsement" #Default is MAJORITY, changed to ALL to enforce stricter control over chaincode lifecycle
    Endorsement: #Policy that defines the condition necessary for a transaction to be approved
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"

  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  
  Addresses:
    - hlf1.disi.unitn.it:5001
    - hlf1.disi.unitn.it:5004
    - hlf1.disi.unitn.it:5007

  # Batch configuration: settings for batch time and size
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB

  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"  # All members of the OrdererMSPs can read
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"  # All members of the OrdererMSPs can write
    Admins:
      Type: ImplicitMeta
      Rule: "ANY Admins"  # Only admins of the OrdererMSPs can manage the orderer
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"  # Any writer can validate blocks

# Channel Defaults (for consistency in the channel configuration)
Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  ChannelUsingRaft:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      EtcdRaft:
        Consenters:
          - Host: hlf1.disi.unitn.it
            Port: 5001
            ClientTLSCert: ../identities/ordererOrganizations/hpcilab_ord1.testbed.local/tls/server.crt
            ServerTLSCert: ../identities/ordererOrganizations/hpcilab_ord1.testbed.local/tls/server.crt
          - Host: hlf1.disi.unitn.it
            Port: 5004
            ClientTLSCert: ../identities/ordererOrganizations/hpcilab_ord2.testbed.local/tls/server.crt
            ServerTLSCert: ../identities/ordererOrganizations/hpcilab_ord2.testbed.local/tls/server.crt
          - Host: hlf1.disi.unitn.it
            Port: 5007
            ClientTLSCert: ../identities/ordererOrganizations/hpcilab_ord3.testbed.local/tls/server.crt
            ServerTLSCert: ../identities/ordererOrganizations/hpcilab_ord3.testbed.local/tls/server.crt
      Organizations:
        - *HPCIlabOrd1
        - *HPCIlabOrd2
        - *HPCIlabOrd3
      Capabilities: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *HPCIlab
      Capabilities: *ApplicationCapabilities
    Consortium: First_Testbed_Consortium